name: CI

on:
  push:
    branches: [trunk, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv run sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format .
      - run: uv run pytest
