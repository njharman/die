[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "die"
dynamic = ["version"]
description = "Library for simulating dice, dice rolls, and stats on dice."
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Norman J. Harman Jr.", email = "njharman@gmail.com" }]
keywords = ["dice", "rpg", "tabletop", "board-game", "simulation", "probability", "random"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/njharman/die"
Repository = "https://github.com/njharman/die"
Changelog = "https://github.com/njharman/die/blob/main/CHANGELOG.rst"
Issues = "https://github.com/njharman/die/issues"
Documentation = "https://python-die.readthedocs.io"

[tool.hatch.version]
path = "src/die/__init__.py"

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "pytest-cov>=6", "ruff>=0.6"]
docs = ["sphinx>=8", "furo>=2024.8"]

[tool.pytest.ini_options]
cache_dir = "$HOME/.cache/pytest/die"
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=die --cov-report=term-missing"

[tool.coverage.run]
source = ["die"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 100

[tool.ruff]
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = [
  "A", # flake8-builtins
  "ASYNC", # flake8-async
  "B", # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4", # unnecessary comprehensions, map()
  "COM", # flake8-commas
  # pydocstyle, docstring formatting; plus D100/D102/D103 because die is a documented public library
  "D100", # missing docstring in public module
  "D102", # missing docstring in public method
  "D103", # missing docstring in public function
  "D200", # one-line docstring fits on one line
  "D201", # no blank line before function docstring
  "D202", # no blank line after function docstring
  "D205", # blank line between summary and description
  "D206", # indent docstring with spaces
  "D207", # docstring under-indented
  "D208", # docstring over-indented
  "D209", # multi-line closing quotes on own line
  "D210", # no whitespace around docstring text
  "D211", # no blank line before class docstring (pick of D203/D211)
  "D212", # multi-line summary on first line (pick of D212/D213)
  "D300", # triple double quotes
  "D301", # r-string if backslashes in docstring
  "D403", # capitalize first word
  "D415", # summary ends with punctuation
  "D419", # no empty docstrings
  "DTZ", # flake8-datetimez
  "E", # pycodestyle
  "ERA", # no commented out code
  "EXE", # flake8-executable
  "F", # pyflakes
  "FLY", # flynt: "".join() of static strings → f-string
  "FURB", # refurb: modern idioms (open().read() → read_text, operator funcs, min/max)
  "G", # flake8-logging-format
  "I", # isort
  "ICN", # import conventions
  "ISC", # implicit string concat
  "LOG", # flake8-logging
  "PERF", # perflint: slow loop patterns (append in loop, dict.items misuse)
  "PGH", # pygrep-hooks (blanket noqa, etc.)
  "PIE", # flake8-pie: misc cruft (unneeded pass, dup class fields, redundant range start)
  "PLC", # pylint conventions
  "PLE", # pylint errors
  "PLW", # pylint warnings
  "PT", # flake8-pytest-style
  "PTH", # use pathlib
  "RET", # flake8-return
  "RSE", # flake8-raise
  "RUF", # ruff rules
  "S", # flake8-bandit
  "SIM", # flake8-simplify
  "SLF", # private member access
  "T10", # debugger: leftover breakpoint()/pdb
  "T20", # print: stray print()/pprint()
  "TID", # tidy imports
  "TRY", # tryceratops: exception handling (raise bare Exception, verbose re-raise, try/else, log.exception)
  "UP", # pyupgrade: drop syntax obsolete for target-version
  "W", # pycodestyle warnings
  "YTT", # sys.version misuse
]
ignore = [
  "C408", # dict()/list() calls are fine
  "C416", # list comprehension over plain iteration is fine (says you)
  "COM812", # conflicts with the formatter
  "COM819", # trailing commas are fine
  "E501", # line length is the formatter's job
  "E731", # lambda assignment is fine
  "RET503", # implicit return None is fine
  "RUF012", # fix wants typing.ClassVar annotation; no type hints
  "S311", # random used for dice simulation, not crypto
  "SIM108", # ternaries allowed, not required
  "SIM300", # yoda conditions are fine
  "TRY003", # long messages at raise site are fine
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = [
  "F401", # re-exports
]
"docs/source/conf.py" = [
  "A001", # `copyright` is Sphinx's required config name
  "D100", # conf.py doesn't need a module docstring
]
"src/die/**" = [
  "SLF001", # die modules share package-private members (_prec, _dice, _func, ...)
]
"examples/*" = [
  "D", # examples don't need docstrings
  "T201", # print is how demos demo
]
"tests/**" = [
  "D", # tests don't need docstrings
  "S101", # assert is how pytest works
  "S108", # temp paths in tests
  "SIM", # tests spell out conditions explicitly for readability
  "SLF001", # tests may poke private members
  "T201", # print in tests is fine
]
