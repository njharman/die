[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "die"
dynamic = ["version"]
description = "Library for simulating dice, dice rolls, and stats on dice."
readme = "README.rst"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Norman J. Harman Jr.", email = "njharman@gmail.com" }]
keywords = ["dice", "rpg", "tabletop", "board-game", "simulation", "probability", "random"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Topic :: Games/Entertainment :: Board Games",
  "Topic :: Games/Entertainment :: Role-Playing",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/njharman/die"
Repository = "https://github.com/njharman/die"
Changelog = "https://github.com/njharman/die/blob/main/CHANGELOG.rst"
Issues = "https://github.com/njharman/die/issues"
Documentation = "https://python-die.readthedocs.io"

[tool.hatch.version]
path = "src/die/__init__.py"

[dependency-groups]
dev = ["pre-commit>=4", "pytest>=8", "pytest-cov>=6", "ruff>=0.6"]
docs = ["sphinx>=8", "furo>=2024.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov=die --cov-report=term-missing"

[tool.coverage.run]
source = ["die"]
branch = true

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:"]
fail_under = 100

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Unused import
"docs/source/conf.py" = ["A001", "D100"]  # `copyright` is Sphinx's required config name; conf.py doesn't need a module docstring
"examples/*" = ["D", "T201"]  # pydocstyle (examples don't need docstrings); print is how demos demo
"tests/*" = [
  "D", # pydocstyle (tests don't need docstrings)
  "S101", # S101 (asserts are how pytest works!)
  "SIM",
  ]

[tool.ruff.lint]
ignore = [
  "C408", # Unnecessary dict/list call, (says you, consistency is more important speed of special case {}, [])
  "C416", # Unnecessary list comprehension (says you)
  "COM819", # Trailing comma is da bomb
  "E731", # I'll assign lambda expression if I want to, and I do!
  "S311", # (I know) Standard pseudo-random generators are not suitable for security/cryptographic purposes
  "SIM108", # I no like ternary operator
  "TRY003", # (I won't) Avoid specifying long messages outside the exception class
]
select = [
  #"ARG", # flake8 unused arguments (not really helpful, unused func args are common and ok)
  #"N", # pep8-naming (too opinionated)
  #"NPY", # numpy
  #"PD", # pandas
  #"PL", # Full Pylint (too much)
  #"PLR", # Pylint refactor (too much/too opinionated)
  "A", # flake8-builtins
  "ASYNC", # https://docs.astral.sh/ruff/rules/#flake8-async-async
  "B", # flake8-bugbear
  "BLE", # flake8-blind-except
  "C4", # unnecessary comprehensions, map()
  "COM", # flake8-commas
  "D100", # Missing docstring in public module
  "D102", # Missing docstring in public method
  "D103", # Missing docstring in public function
  "D200", # One-line docstring should fit on one line
  "D201", # No blank lines allowed after function docstring
  "D202", # No blank lines allowed after function docstring
  "D205", # 1 blank line required between summary line and description
  "D206", # Docstring should be indented with spaces, not tabs
  "D207", # Docstring under-indented
  "D208", # Docstring over-indented
  "D209", # Multi-line docstring closing quotes on separate line
  "D210", # No whitespaces allowed surrounding docstring text
  "D211", # No blank lines allowed before class docstring
  "D212", # Multi-line docstring summary should start at the first line
  "D300", # Use triple double quotes
  "D301", # Use r-string if any backslashes in a docstring
  "D415", # First line should end with punctuation (period/?/!)
  "DTZ", # flake8-datetimez
  "E", # pycodestyle
  "ERA", # No commented out code
  "EXE", # flake8-executable
  "F", # pyflakes
  "FLY", # flynt
  "G", # flake8-logging-format
  "I", # isort
  "ICN", # https://github.com/joaopalmeiro/flake8-import-conventions
  "ISC", # https://pypi.org/project/flake8-implicit-str-concat/
  "LOG", # flake8-logging
  "PERF", # perflint
  "PIE", # https://pypi.org/project/flake8-pie/
  "PLC", # Pylint conventions
  "PLE", # Pylint error
  "PLW", # Pylint warnings
  "PT", # https://pypi.org/project/flake8-pytest-style/
  "PTH", # flake8 use pathlib
  "RET", # https://pypi.org/project/flake8-return/
  "RUF", # Ruff rules
  "S", # https://docs.astral.sh/ruff/rules/#flake8-bandit-s
  "SIM", # https://pypi.org/project/flake8-simplify/
  "T", # flake8-debugger
  "TRY", # tryceratops
  "UP", # pyupgrade
  "W", # pycodestyle
]
